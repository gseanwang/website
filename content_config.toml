[bio]
summary = """
Plant pathologist with a Ph.D. from the University of Florida (Advisors: Dr. Mathews Paret and Dr. Jeffrey Rollins), specializing in **applied disease management**, **crop protection**, **seed health**, and **pathogen diagnostics**.

My doctoral research targeted carrot diseases — especially **Alternaria leaf blight** — connecting field trials, seed treatment and seed health evaluation, pathogen identification, and phylogenetic analysis to practical disease management across **conventional, organic, and regenerative** production systems.

This work informs management protocols for **~50,000 acres** of commercial carrot production nationally. I focus on applied agricultural R&D that generates high-quality, practical data to support growers and product development.
"""

